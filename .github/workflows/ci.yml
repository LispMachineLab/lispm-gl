name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  emacs:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 30 and 31 must refuse, fetching and loading nothing; the snapshot
        # is Emacs 32, built without a window system here, so it has no
        # canvases to draw in and the drawing tests are skipped.
        emacs: ['30.1', '31.1', snapshot]
    steps:
      - uses: actions/checkout@v7
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Byte-compile
        run: make compile
      - name: Test
        run: make test

  module:
    name: Module on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Check
        working-directory: native
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings
      - name: Build
        run: make module
